name: Scheduled publishing of qwc-uwsgi-base docker image

on:
  schedule:
    - cron: "23 23 * * WED" # every Wednesday on 21:23 UTC

  workflow_dispatch:

jobs:

  branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0

      - id: branches
        run: |
          branches=$(\
            git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | \
            grep -Eo '^(main|master|.*-lts)$' | \
            jq -R -s -c 'split("\n")[:-1]'\
          )
          echo "Found branches $branches"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  build:
    needs: branches
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: ${{ fromJson(needs.branches.outputs.branches) }}

    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ matrix.branch }}

      - name: Get version tags
        id: get_tag
        run: |
          branch_suffix=""
          if [[ "${{ matrix.branch }}" != "main" ]]; then
            branch_suffix="-${{ matrix.branch }}"
          fi
          echo "alpine_tags=alpine-latest${branch_suffix}" >>$GITHUB_OUTPUT
          echo "ubuntu_tags=ubuntu-latest${branch_suffix}" >>$GITHUB_OUTPUT

      - name: Print tags
        run: |
          echo "Matrix value: ${{ matrix.branch}}"
          echo "Branch: ${{github.ref_name}}"
          echo "Alpine tags: ${{ steps.get_tag.outputs.alpine_tags }}"
          echo "Ubuntu tags: ${{ steps.get_tag.outputs.ubuntu_tags }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Alpine docker image
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: sourcepole/qwc-uwsgi-base
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          tags: "${{ steps.get_tag.outputs.alpine_tags }}"
          workdir: alpine
          platforms: linux/arm64,linux/amd64

      - name: Build and publish Ubuntu docker image
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: sourcepole/qwc-uwsgi-base
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          tags: "${{ steps.get_tag.outputs.ubuntu_tags }}"
          workdir: ubuntu
          platforms: linux/arm64,linux/amd64
