name: Publish qwc-uwsgi-base docker image

on: [push]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@master

    - name: Get version tags
      id: get_tag
      run: |
        SHOULD_RUN=false
        if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
          echo "alpine_tags=alpine-latest,alpine-${GITHUB_REF:10}" >>$GITHUB_OUTPUT
          echo "ubuntu_tags=ubuntu-latest,ubuntu-${GITHUB_REF:10}" >>$GITHUB_OUTPUT
          SHOULD_RUN=true
        fi
        echo "run_next=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

    - name: Print tags
      if: steps.get_tag.outputs.run_next == 'true'
      run: |
        echo "Commit: $(git rev-parse HEAD)"
        echo "Alpine tags: ${{ steps.get_tag.outputs.alpine_tags }}"
        echo "Ubuntu tags: ${{ steps.get_tag.outputs.ubuntu_tags }}"

    - name: Set up QEMU
      if: steps.get_tag.outputs.run_next == 'true'
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: steps.get_tag.outputs.run_next == 'true'
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and publish Alpine docker image
      if: steps.get_tag.outputs.run_next == 'true'
      uses: elgohr/Publish-Docker-Github-Action@v5
      with:
        name: sourcepole/qwc-uwsgi-base
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        tags: "${{ steps.get_tag.outputs.alpine_tags }}"
        workdir: alpine
        platforms: linux/arm64,linux/amd64

    - name: Build and publish Ubuntu docker image
      if: steps.get_tag.outputs.run_next == 'true'
      uses: elgohr/Publish-Docker-Github-Action@v5
      with:
        name: sourcepole/qwc-uwsgi-base
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        tags: "ubuntu-${{ steps.get_tag.outputs.ubuntu_tags }}"
        workdir: ubuntu
        platforms: linux/arm64,linux/amd64
